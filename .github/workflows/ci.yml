name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: cargo check
        run: cargo check
      - name: migrate and seed on sqlite
        run: |
          cp .env.example .env
          cargo run -- migrate:fresh --seed

  frontend:
    name: Frontend Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Fijada para reproducibilidad: desde 3.48 el import de
          # flutter/material.dart emite infos de deprecación masivos.
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - name: pub get
        run: flutter pub get
      - name: analyze
        run: flutter analyze
      - name: build web
        run: flutter build web --release

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build api image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
      - name: build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
