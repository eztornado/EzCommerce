[package]
name = "ezcommerce-api"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
larust-core = "0.10.0"
larust-http = "0.10.0"
larust-support = { version = "0.10.0", default-features = false, features = ["sqlite", "mysql"] }
dotenvy = "0.15"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "mysql", "derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
bcrypt = "0.17"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
image = "0.25"
base64 = "0.22"
md5 = "0.7"
regex = "1"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.6", features = ["cors"] }
mime_guess = "2"
deunicode = "1"

[dev-dependencies]
larust-testing = "0.10.0"
