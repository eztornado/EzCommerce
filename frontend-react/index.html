<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060C3B" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="ard" href="/.well-known/ard.json" />
    <meta
      name="description"
      content="EzCommerce: moda, electrónica, hogar y mucho más con envío rápido y pago seguro."
    />
    <!-- Solo las 2 fuentes above-the-fold; el resto baja por CSS al usarse. -->
    <link rel="preload" href="/fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dm-serif-display-400.woff2" as="font" type="font/woff2" crossorigin />
    <title>EzCommerce</title>
  </head>
  <body>
    <!-- Shell de carga (#39): pinta header + esqueleto al parsear el HTML,
         sin esperar al bundle. React lo sustituye en el primer render.
         Mismos colores que los skeletons de bagisto.css para un tránsito suave. -->
    <div id="root">
      <div data-shell="1" style="min-height:100vh;background:#fff;font-family:system-ui,sans-serif">
        <div style="height:34px;background:#060c3b"></div>
        <header style="display:flex;align-items:center;gap:10px;height:72px;padding:0 16px;background:#fff;border-bottom:1px solid #f1f2f4">
          <span style="width:38px;height:38px;border-radius:8px;background:#060c3b;display:inline-block"></span>
          <span style="width:128px;height:16px;border-radius:4px;background:#e5e7eb;display:inline-block"></span>
          <span style="flex:1"></span>
          <span style="width:34px;height:34px;border-radius:50%;background:#f1f5f9;display:inline-block"></span>
          <span style="width:34px;height:34px;border-radius:50%;background:#f1f5f9;display:inline-block"></span>
          <span style="width:34px;height:34px;border-radius:50%;background:#f1f5f9;display:inline-block"></span>
        </header>
        <div style="padding:16px 14px">
          <div style="height:min(520px,60vw);border-radius:12px;background:linear-gradient(100deg,#eef1f6 30%,#f8fafc 50%,#eef1f6 70%);background-size:200% 100%"></div>
          <div style="margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px">
            <div style="aspect-ratio:1/1;border-radius:8px;background:#eef1f6"></div>
            <div style="aspect-ratio:1/1;border-radius:8px;background:#eef1f6"></div>
            <div style="aspect-ratio:1/1;border-radius:8px;background:#eef1f6"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
