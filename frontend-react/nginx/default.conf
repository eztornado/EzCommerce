server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA de React (routing client-side)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy del API (mismo origen, sin CORS)
    location /api/ {
        proxy_pass http://api:34188/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Imágenes subidas
    location /storage/ {
        proxy_pass http://api:34188/storage/;
    }
}
