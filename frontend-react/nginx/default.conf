server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    sendfile on;
    tcp_nopush on;
    client_max_body_size 16m;

    # Compresión de texto (JS/CSS/JSON/HTML/SVG). Las fuentes ya son woff2.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Assets con hash: caché inmutable durante un año.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fonts/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA de React (routing client-side). El HTML siempre se revalida.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Navegación agéntica (#40): llms.txt y manifiesto ARD generados por el
    # API (rutas raíz en routes/web.rs). Sin estos bloques el SPA serviría
    # HTML donde los agentes esperan Markdown/JSON. El backend añade
    # Cache-Control público (1h).
    location = /llms.txt {
        proxy_pass http://api:34188;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ai-catalog.json {
        proxy_pass http://api:34188;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/ {
        proxy_pass http://api:34188;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy del API (mismo origen, sin CORS)
    location /api/ {
        proxy_pass http://api:34188/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Imágenes subidas (el API ya envía Cache-Control/ETag)
    location /storage/ {
        proxy_pass http://api:34188/storage/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
