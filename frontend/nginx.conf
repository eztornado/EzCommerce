server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La SPA enruta por fragmento (#/...); estas rutas planas típicas
    # redirigen a su equivalente real para no caer en la pantalla equivocada.
    location = /admin { return 302 /#/admin; }
    location = /admin/ { return 302 /#/admin; }
    location = /admin/login { return 302 /#/admin/login; }
    location = /login { return 302 /#/login; }
    location = /register { return 302 /#/register; }

    # SPA de Flutter web.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy del API (el frontend llama a /api/... en el mismo origen).
    location /api/ {
        proxy_pass http://api:34188/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /storage/ {
        proxy_pass http://api:34188/storage/;
    }
}
